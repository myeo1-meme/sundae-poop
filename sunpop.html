  const cap=Math.max(Math.min(H*.38,H-(c.bottom-r.top)-ph*.6),ph*.5+30);
  const cx=c.left-r.left+c.width/2;
  // 가장 낮은 자리를 후보 중에서 고름 -> 바닥이 고르게 쌓임
  let bx=0,bh=1e9;
  for(let i=0;i<6;i++){const x=Math.max(0,Math.min(W-pw,cx-pw/2+(Math.random()-.5)*W*.8));const h=hAt(x,pw);if(h<bh){bh=h;bx=x}}
  if(bh+ph*.5>cap&&!flushing)flush();
  if(flushing){bh=0}
  const land=H-bh-ph,x0=cx-pw/2+(Math.random()-.5)*pw*.6,y0=c.bottom-r.top-Math.min(ph,70)*.9;
  const w=document.createElement('div');w.className='poop';w.style.cssText=`width:${pw}px;left:${x0}px;top:${y0}px`;
  const i=document.createElement('img');i.src=im.src;w.appendChild(i);stage.appendChild(w);
  const dx=bx-x0,dy=Math.max(0,land-y0),rot=(Math.random()-.5)*24,dur=450+dy*0.55;
  w.animate([{transform:'translateX(0)'},{transform:`translateX(${dx}px)`}],{duration:dur,fill:'forwards',easing:'ease-out'});
  i.animate([{transform:'translateY(0) scale(.4)',opacity:0},{transform:'translateY(0) scale(1)',opacity:1,offset:.1},{transform:`translateY(${dy}px) rotate(${rot}deg) scale(1)`,opacity:1,offset:.88,easing:'ease-in'},{transform:`translateY(${dy}px) rotate(${rot}deg) scale(1.15,.88)`,opacity:1,offset:.94},{transform:`translateY(${dy}px) rotate(${rot}deg) scale(1)`,opacity:1}],{duration:dur,fill:'forwards',easing:'cubic-bezier(.4,0,1,1)'});
  if(!flushing){pile.push(w);const top=bh+ph*.5;for(let b=Math.floor(bx/B);b<=Math.floor((bx+pw)/B);b++)heights[b]=top}
  else{setTimeout(()=>w.remove(),dur+700)}
}
function poke(){
  n++;cnt.textContent=n;hint.style.display='none';
  try{localStorage.setItem('poopCount',n)}catch(e){}
  const sc=pickScale();click(sc);
  ch.classList.remove('shake');void ch.offsetWidth;ch.classList.add('shake');
  drop(sc);
}
ch.addEventListener('pointerdown',e=>{e.preventDefault();poke()});
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();poke()}});
</script>
